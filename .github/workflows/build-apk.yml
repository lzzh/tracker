name: Build APK
on:
  push:
    branches: [ main, master, lzzh ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=$ANDROID_HOME
          mkdir -p "$ANDROID_HOME/licenses"
          echo "24333f8a63b68ba58666a6100c996c5f" > "$ANDROID_HOME/licenses/android-sdk-license"
          echo "55d711544f6b555c266c9100155f4e02" >> "$ANDROID_HOME/licenses/android-sdk-license"
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          CLT_VER=""
          for v in 13114758 12700310 11076708 9477386; do
            code=$(curl -sI -o /dev/null -w '%{http_code}' "https://dl.google.com/android/repository/commandlinetools-linux-${v}_latest.zip" || echo 000)
            if [ "$code" = "200" ]; then CLT_VER=$v; break; fi
          done
          if [ -z "$CLT_VER" ]; then echo "No valid cmdline-tools version found"; exit 1; fi
          echo "Using commandlinetools-linux-${CLT_VER}_latest.zip"
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl -fsSL "https://dl.google.com/android/repository/commandlinetools-linux-${CLT_VER}_latest.zip" -o /tmp/clt.zip
          unzip -q -o /tmp/clt.zip -d "$ANDROID_HOME/cmdline-tools/"
          rm -rf "$ANDROID_HOME/cmdline-tools/latest"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          SM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "$SM" --sdk_root="$ANDROID_HOME" --licenses >/dev/null 2>&1 || true
          "$SM" --sdk_root="$ANDROID_HOME" 'platforms;android-34' 'build-tools;34.0.0' 'platform-tools'

      - name: Setup Gradle
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-8.7-bin.zip -o /tmp/gradle.zip
          unzip -q -o /tmp/gradle.zip -d /opt/
          ln -sf /opt/gradle-8.7/bin/gradle /usr/local/bin/gradle
          gradle --version

      - name: Build Debug APK
        run: |
          VC="${GITHUB_RUN_NUMBER:-$(git rev-list --count HEAD)}"
          VN="1.$VC-$(git rev-parse --short HEAD)"
          echo "版本号: code=$VC name=$VN"
          gradle assembleDebug --no-daemon --stacktrace -PversionCode=$VC -PversionName="$VN"
          ls -lh app/build/outputs/apk/debug/*.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: life-trace-apk
          path: app/build/outputs/apk/debug/*.apk
